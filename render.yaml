services:
  - type: web
    name: hema-rulebook-search
    runtime: python
    runtimeVersion: "3.11"
    buildCommand: |
      pip install -r requirements.txt && \
      mkdir -p dist && \
      python build.py && \
      test -f dist/rulebook_hun.html && \
      test -f dist/rulebook_eng.html && \
      test -f data/search/rules_index_hun.json && \
      test -f data/search/rules_index_eng.json && \
      test -f data/search/rules_index.json
    startCommand: gunicorn --bind 0.0.0.0:${PORT:-10000} --workers 1 --timeout 120 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_ENV
        value: production
