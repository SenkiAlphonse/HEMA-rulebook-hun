services:
  - type: web
    name: hema-rulebook-search
    runtime: python
    runtimeVersion: "3.11"
    buildCommand: |
      pip install -r requirements.txt && \
      pytest tests/ -v && \
      mkdir -p dist && \
      python build.py && \
      ls -la dist/rulebook.html
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_ENV
        value: production
