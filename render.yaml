services:
  - type: web
    name: hema-rulebook-search
    runtime: python
    runtimeVersion: "3.11"
    buildCommand: pip install -r requirements.txt && pytest tests/ -v && python build.py
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_ENV
        value: production
