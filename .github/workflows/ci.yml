name: CI

on:
  push:
    branches: [ main, ai-agent, cleanup ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/
      - name: Check code compiles
        run: |
          python -m py_compile wsgi.py build.py tools/build.py tools/setup_check.py tools/check_integrity.py
          python -m py_compile src/qa_tools/tools/*.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run build script
        run: python build.py
      - name: Verify build artifacts
        run: |
          test -f data/search/rules_index.json
          test -f data/search/rules_index_hun.json
          test -f data/search/rules_index_eng.json
          test -f dist/rulebook_hun.html
          test -f dist/rulebook_eng.html
      - name: Check rule integrity
        run: python tools/check_integrity.py
      - name: Commit build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/search/rules_index.json data/search/rules_index_hun.json data/search/rules_index_eng.json dist/rulebook_hun.html dist/rulebook_eng.html
          git diff --staged --quiet || git commit -m "chore: rebuild search index and rulebook [skip ci]"
          git push
