name: Tests

on:
  push:
    branches: [ main, ai-agent ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v
    
    - name: Check code compiles
      run: |
        python -m py_compile app.py build.py
        python -m py_compile qa_tools/tools/*.py

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run build script
      run: |
        python build.py
    
    - name: Verify build artifacts
      run: |
        test -f qa_tools/rules_index.json
        test -f dist/rulebook.html
    
    - name: Commit build artifacts
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add qa_tools/rules_index.json dist/rulebook.html
        git diff --staged --quiet || git commit -m "chore: rebuild search index and rulebook [skip ci]"
        git push
