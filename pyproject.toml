[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-tools"
version = "1.0.0"
description = "Q&A tools and search engine for the HEMA rulebook"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "HEMA Rulebook Project" }]
dependencies = [
    "Flask>=3.0",
    "Werkzeug>=3.0",
    "mistune>=3.0",
]

[project.optional-dependencies]
prod = ["gunicorn>=20.1.0"]
dev = [
    "pytest>=8",
    "pytest-flask>=1.3",
    "pytest-mock>=3.15",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
hema-search = "qa_tools.search_engine.search_aliases:main"
hema-demo = "qa_tools.tools.demo_search:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Tests that take a long time to run",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    ".venv",
    "dist",
    "data",
    "artifacts",
    "rules",
    "rules_en",
    "fuggelek",
]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade,
# SIM: simplify, C4: comprehensions, RUF: ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",   # line length (handled by formatter, soft limit)
    "B008",   # function calls in argument defaults (Flask pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "F401"]
"tools/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
