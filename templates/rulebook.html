<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEMA Rulebook - Magyar Hosszúkardvívó Sportszövetség (Hungarian Longsword Federation)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
            background: #f5f2eb;
            color: #2c3e50;
            line-height: 1.6;
            min-height: 100vh;
        }

        :root {
            --anchor-scroll-offset: 110px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e0d8c8;
        }

        .header {
            background: #1a1f2e;
            background-image:
                repeating-linear-gradient(45deg, rgba(201,162,39,0.07) 0px, rgba(201,162,39,0.07) 1px, transparent 1px, transparent 14px),
                repeating-linear-gradient(-45deg, rgba(201,162,39,0.07) 0px, rgba(201,162,39,0.07) 1px, transparent 1px, transparent 14px);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 3px solid #c9a227;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e8d5a0;
            font-family: 'Cinzel', Georgia, serif;
        }

        .header p {
            font-size: 1em;
            opacity: 0.9;
            font-weight: 400;
        }

        .content {
            padding: 2rem;
        }

        .rule {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #ecf0f1;
        }

        .rule:last-child {
            border-bottom: none;
        }

        .rule-header {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .rule-id {
            background: none;
            color: inherit;
            padding: 0;
            border-radius: 0;
            font-weight: 700;
            font-family: "Courier New", monospace;
            font-size: 1.05em;
            cursor: default;
            color: #34495e;
        }

        .rule-id:hover {
            text-decoration: none;
        }

        /* Copy-link button injected next to each rule-id paragraph */
        .rule-copy-link {
            border: 0;
            background: transparent;
            color: #95a5a6;
            cursor: pointer;
            margin-left: 0.4em;
            padding: 0 0.3em;
            font-size: 0.85em;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.15s ease, color 0.15s ease;
            vertical-align: middle;
        }
        .rule-id:hover .rule-copy-link,
        .rule-copy-link:focus,
        .rule-copy-link.copied {
            opacity: 1;
        }
        .rule-copy-link:hover {
            color: #2980b9;
        }
        .rule-copy-link.copied {
            color: #27ae60;
        }
        @media (pointer: coarse) {
            /* Touch-primary devices: always-visible icon, ≥44px tap area, centered. */
            .rule-copy-link {
                opacity: 0.6;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 44px;
                min-height: 44px;
                padding: 0.4em 0.5em;
            }
        }
        @media print {
            /* Print stylesheet — optimised for printing the rulebook on paper */
            @page { margin: 1.5cm; }
            html, body { background: #ffffff !important; color: #000 !important; }
            body { font-size: 11pt; line-height: 1.45; }
            .container { box-shadow: none !important; border: none !important; max-width: 100% !important; margin: 0 !important; }
            .header { background: #ffffff !important; color: #000 !important; padding: 0 0 0.6cm 0 !important; border-bottom: 1px solid #000 !important; }
            .header h1, .header p { color: #000 !important; }
            .header h1 { font-size: 16pt; }
            /* Hide interactive chrome */
            .search-box, .back-to-top, .rule-copy-link { display: none !important; }
            /* Keep rule blocks together when possible */
            .rule, p.rule-id { page-break-inside: avoid; break-inside: avoid; }
            p.rule-id { page-break-after: avoid; break-after: avoid; }
            h1, h2, h3, h4 { page-break-after: avoid; break-after: avoid; }
            /* Plain ink for links + badges */
            .rule-text a, a.rule-ref, .ref-link {
                color: #000 !important;
                background: none !important;
                border-bottom: none !important;
                text-decoration: underline;
            }
            .meta-badge { background: none !important; color: #000 !important; border: 1px solid #999 !important; }
            .content { padding: 0 !important; }
        }

        .rule-metadata {
            font-size: 0.8em;
            color: #7f8c8d;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .meta-badge {
            display: inline-block;
            background-color: #e8f1f7;
            color: #2c5aa0;
            padding: 0.3rem 0.7rem;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .meta-badge.weapon {
            background-color: #f4ede1;
            color: #8b6f47;
        }

        .rule-text {
            margin-top: 0.8rem;
            line-height: 1.8;
            color: #34495e;
        }

        .rule-text p {
            margin-bottom: 0.8rem;
        }

        .rule-text ul,
        .rule-text ol {
            margin-left: 2rem;
            margin-bottom: 0.8rem;
        }

        ul.bullet-list {
            margin-left: 2rem;
            margin-bottom: 0.8rem;
        }

        .rule-text li {
            margin-bottom: 0.5rem;
        }

        .rule-text ul ul,
        .rule-text ol ol,
        .rule-text ul ol,
        .rule-text ol ul {
            margin-left: 2rem;
            margin-top: 0.5rem;
        }

        .rule-text strong {
            font-weight: 700;
            color: #2c3e50;
        }

        .rule-text em {
            font-style: italic;
            color: #34495e;
        }

        .rule-text a {
            color: #34495e;
            text-decoration: none;
            border-bottom: 1px solid #bdc3c7;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .rule-text a:hover {
            background-color: #f0f3f7;
            border-bottom-color: #34495e;
        }

        .ref-link {
            background-color: #f5f5f5;
            padding: 0.2rem 0.4rem;
            border-radius: 2px;
            font-weight: 600;
            border-bottom: 2px solid #bdc3c7;
        }

        .ref-link:hover {
            background-color: #e8eaed;
        }

        .rule-text img {
            max-width: 100%;
            height: auto;
            margin: 1rem 0;
            border: 1px solid #e8eaed;
            border-radius: 4px;
        }

        .rule-id.rule-depth-1,
        .rule-id.rule-depth-2,
        .rule-id.rule-depth-3 {
            margin-left: 0;
            margin-top: 1.5rem;
            margin-bottom: 0.3rem;
        }

        .rule-id.rule-depth-4 {
            margin-left: 2rem;
            margin-top: 1.5rem;
            margin-bottom: 0.3rem;
        }

        .rule-id.rule-depth-5 {
            margin-left: 4rem;
            margin-top: 1.5rem;
            margin-bottom: 0.3rem;
        }

        p.rule-depth-4 {
            margin-left: 2rem;
            margin-top: 0;
            margin-bottom: 0.8rem;
        }

        p.rule-depth-5 {
            margin-left: 4rem;
            margin-top: 0;
            margin-bottom: 0.8rem;
        }

        .rule-id strong {
            color: inherit;
            font-family: inherit;
            background: none;
            padding: 0;
            border: none;
            display: inline;
            font-weight: 700;
        }

        a.rule-ref {
            color: #34495e;
            text-decoration: none;
            font-weight: inherit;
            padding: 0.15rem 0.5rem;
            background-color: #f0f3f7;
            border-radius: 3px;
            transition: all 0.2s ease;
            cursor: pointer;
            border-bottom: 1.5px solid #bdc3c7;
            display: inline;
        }

        a.rule-ref:hover {
            background-color: #34495e;
            color: white;
            border-bottom-color: #2c3e50;
            text-decoration: none;
        }

        a.rule-ref:focus {
            outline: 2px solid #34495e;
            outline-offset: 2px;
        }

        @keyframes highlight-pulse {
            0% { background-color: transparent; }
            50% { background-color: #fff3cd; }
            100% { background-color: transparent; }
        }

        .rule-id.highlighted {
            animation: highlight-pulse 1.5s ease-in-out;
        }

        .bullet-list {
            list-style-type: disc;
            margin-left: 2rem;
            margin-bottom: 1rem;
            padding-left: 1rem;
            line-height: 1.6;
        }

        .rule-text table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background-color: #ffffff;
            border: 1px solid #e8eaed;
            border-radius: 4px;
            overflow: hidden;
        }

        .rule-text table thead {
            background-color: #34495e;
            color: white;
        }

        .rule-text table th {
            padding: 0.8rem;
            text-align: left;
            font-weight: 700;
            border: 1px solid #e8eaed;
        }

        .rule-text table td {
            padding: 0.8rem;
            border: 1px solid #e8eaed;
        }

        .rule-text table tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .rule-text table tbody tr:hover {
            background-color: #ecf0f1;
        }

        .rule-text table [bgcolor] {
            background-color: attr(bgcolor) !important;
            color: white;
            font-weight: 600;
        }

        .rule-text table [bgcolor="#E3D059"] {
            background-color: #ffc107 !important;
            color: #333 !important;
        }

        .rule-text table [bgcolor="#E36159"] {
            background-color: #e74c3c !important;
            color: white !important;
        }

        .rule-text table [bgcolor="#787878"] {
            background-color: #7f8c8d !important;
            color: white !important;
        }

        .rule-text table sup {
            font-size: 0.8rem;
        }

        h1 {
            color: #1a1f2e;
            margin-top: 2.5rem;
            margin-bottom: 0.8rem;
            border-bottom: 2px solid #c9a227;
            padding-bottom: 0.5rem;
            font-size: 1.8em;
            font-weight: 600;
            font-family: 'Cinzel', Georgia, serif;
            letter-spacing: 0.5px;
        }

        h2 {
            color: #2c3e50;
            margin-top: 2rem;
            margin-bottom: 0.6rem;
            border-bottom: 1px solid #e0d8c8;
            padding-bottom: 0.3rem;
            font-size: 1.4em;
            font-weight: 600;
            font-family: 'Cinzel', Georgia, serif;
            letter-spacing: 0.3px;
        }

        h3 {
            color: #7f8c8d;
            margin-top: 1.8rem;
            margin-bottom: 0.5rem;
            font-size: 1.1em;
            font-weight: 700;
        }

        h4 {
            color: #95a5a6;
            margin-top: 1.5rem;
            margin-bottom: 0.4rem;
            font-size: 1em;
            font-weight: 700;
        }

        h5 {
            color: #b0b0b0;
            margin-top: 1.2rem;
            margin-bottom: 0.3rem;
            font-size: 0.95em;
            font-weight: 700;
        }

        h6 {
            color: #b0b0b0;
            margin-top: 1rem;
            margin-bottom: 0.3rem;
            font-size: 0.9em;
            font-weight: 700;
        }

        .references-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #e8eaed;
            color: #7f8c8d;
        }

        .references-section strong {
            color: #2c3e50;
        }

        .reference-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.3rem;
        }

        .reference-item {
            background-color: #f0f3f7;
            color: #34495e;
            padding: 0.4rem 0.8rem;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }

        .reference-item:hover {
            background-color: #e8eaed;
            text-decoration: underline;
        }

        .back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #34495e;
            color: white;
            border: none;
            padding: 0;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(52, 73, 94, 0.25);
            font-size: 1.5em;
            transition: all 0.25s ease;
            z-index: 1000;
        }

        .back-to-top:hover {
            background: #2c3e50;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(52, 73, 94, 0.35);
        }

        .back-to-top.show {
            display: flex;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
        }

        .spinner {
            border: 4px solid #ecf0f1;
            border-top: 4px solid #34495e;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .rule.highlight {
            background-color: #fffacd;
            padding: 1rem;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 250, 205, 0.5);
            animation: highlightFade 2s ease-out;
        }

        @keyframes highlightFade {
            0% {
                background-color: #ffff00;
                box-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
            }
            100% {
                background-color: #fffacd;
                box-shadow: 0 0 10px rgba(255, 250, 205, 0.5);
            }
        }

        .search-box {
            position: sticky;
            top: 0;
            background: #ffffff;
            padding: 1.2rem 2rem;
            border-bottom: 1px solid #e8eaed;
            z-index: 100;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .search-box input {
            flex: 1;
            padding: 0.75rem;
            border: 1.5px solid #dfe1e4;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.25s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #34495e;
            box-shadow: 0 0 0 3px rgba(52, 73, 94, 0.08);
        }

        .search-box button {
            padding: 0.75rem 1.5rem;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-size: 0.9em;
        }

        .search-box button:hover {
            background: #2c3e50;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(52, 73, 94, 0.25);
        }

        .nav-buttons {
            display: flex;
            gap: 0.8rem;
        }

        .nav-btn {
            padding: 0.75rem 1.5rem;
            background: #34495e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-size: 0.9em;
        }

        .nav-btn:hover {
            background: #2c3e50;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(52, 73, 94, 0.25);
        }

        .toc-container {
            background-color: #f8f5ee;
            border-left: 3px solid #c9a227;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            border-radius: 5px;
            border: 1px solid #e0d8c8;
        }

        .toc-container h2 {
            margin-top: 0;
            border: none;
            color: #34495e;
            font-size: 1.3em;
            padding-bottom: 0;
        }

        .toc-list {
            list-style: none;
            padding: 0;
        }

        .toc-item {
            margin: 0.5rem 0;
            line-height: 1.6;
        }

        .toc-item.level-1 {
            margin-left: 0;
            font-weight: 700;
        }

        .toc-item.level-2 {
            margin-left: 1.5rem;
        }

        .toc-item.level-3 {
            margin-left: 3rem;
            font-size: 0.95em;
        }

        .toc-item a {
            color: #34495e;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid transparent;
        }

        .toc-item a:hover {
            color: #2c3e50;
            text-decoration: underline;
            border-bottom-color: #34495e;
        }

        .section-heading {
            scroll-margin-top: var(--anchor-scroll-offset);
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .rule-id[id],
        h1[id],
        h2[id],
        h3[id],
        h4[id],
        h5[id] {
            scroll-margin-top: var(--anchor-scroll-offset);
        }

        .section-heading h1 {
            margin-top: 0;
        }

        .section-heading h2 {
            margin-top: 0;
        }

        .section-heading h3 {
            margin-top: 0;
        }

        @media (max-width: 768px) {
            .container {
                box-shadow: none;
                border: none;
            }

            .header {
                padding: 2rem 1rem;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 1.2rem;
            }

            .search-box {
                flex-direction: column;
                gap: 0.8rem;
            }

            .search-box input,
            .search-box button {
                width: 100%;
            }

            .rule-header {
                flex-wrap: wrap;
            }

            .nav-buttons {
                width: 100%;
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚔️ HEMA Rulebook</h1>
            <p>Magyar Hosszúkardvívó Sportszövetség - Complete Rulebook Viewer</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search rules... (e.g., GEN-6.2.3 or DIS-5.2.1)">
            <div class="nav-buttons">
                <button class="nav-btn" onclick="jumpToRule()">Jump to Rule</button>
                <button class="nav-btn" onclick="clearHighlight()">Clear Highlight</button>
            </div>
        </div>

        <div class="content" id="ruleContent">
            {{ markdown_content|safe }}
        </div>

        <footer style="margin-top: 3rem; padding: 1.5rem 0; text-align: center; font-size: 0.85em; opacity: 0.7; border-top: 1px solid rgba(0,0,0,0.1);">
            Ruleset {{ ruleset_version }}{% if ruleset_last_updated and ruleset_last_updated != "unknown" %} &middot; updated {{ ruleset_last_updated }}{% endif %}
        </footer>
    </div>

    <button class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</button>
    <button id="nav-back-button" title="Vissza az előző szabályhoz" aria-label="Vissza / Back" style="display:none;position:fixed;bottom:90px;right:32px;z-index:1000;padding:10px 18px;background:#222;color:#fff;border:none;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.2);font-size:1rem;cursor:pointer;">Vissza / Back</button>

    <script>

        function getScrollOffset() {
            const searchBox = document.querySelector('.search-box');
            if (!searchBox) {
                return 16;
            }
            return Math.ceil(searchBox.getBoundingClientRect().height + 12);
        }

        function updateAnchorScrollOffsetVar() {
            document.documentElement.style.setProperty('--anchor-scroll-offset', `${getScrollOffset()}px`);
        }

        function scrollToElementWithOffset(element, behavior = 'smooth') {
            if (!element) {
                return;
            }
            const targetTop = Math.max(0, element.getBoundingClientRect().top + window.scrollY - getScrollOffset());
            window.scrollTo({ top: targetTop, behavior });
        }

        function highlightRuleTarget(element) {
            if (!element) {
                return;
            }
            element.classList.add('highlighted');
            setTimeout(() => {
                element.classList.remove('highlighted');
            }, 1500);
        }

        function alignToHashTarget(behavior = 'auto') {
            const hash = decodeURIComponent(window.location.hash || '').replace(/^#/, '');
            if (!hash) {
                return;
            }
            const hashTarget = document.getElementById(hash);
            if (hashTarget) {
                scrollToElementWithOffset(hashTarget, behavior);
            }
        }

        // Navigation history for rule references
        const navigationHistory = [];
        const navBackButton = document.getElementById('nav-back-button');

        // Show/hide nav back button
        function showNavBackButton() {
            navBackButton.style.display = 'block';
        }
        function hideNavBackButton() {
            navBackButton.style.display = 'none';
        }

        // Handle rule reference clicks
        document.addEventListener('click', (e) => {
            let target = e.target;
            if (target.tagName === 'A' && target.classList.contains('rule-ref')) {
                e.preventDefault();
                e.stopPropagation();
                const targetRuleId = target.dataset.ruleId || target.textContent.trim();
                navigateToRule(targetRuleId);
            }
        }, true);

        function navigateToRule(targetRuleId) {
            const currentPosition = window.scrollY;
            const targetElement = document.getElementById(targetRuleId);
            if (targetElement) {
                navigationHistory.push({ position: currentPosition, timestamp: Date.now() });
                scrollToElementWithOffset(targetElement, 'smooth');
                highlightRuleTarget(targetElement);
                showNavBackButton();
            } else {
                alert(`Szabály ${targetRuleId} nem található az szabályzatban`);
            }
        }

        navBackButton.addEventListener('click', () => {
            if (navigationHistory.length > 0) {
                const previous = navigationHistory.pop();
                window.scrollTo({ top: previous.position, behavior: 'smooth' });
                if (navigationHistory.length === 0) {
                    hideNavBackButton();
                }
            }
        });

        // Hide nav back button on blur or after timeout
        navBackButton.addEventListener('blur', hideNavBackButton);
        // Optional: auto-hide after 30s
        setInterval(() => {
            if (navBackButton.style.display === 'block' && navigationHistory.length === 0) {
                hideNavBackButton();
            }
        }, 30000);

        function jumpToRule() {
            const query = document.getElementById('searchInput').value.trim().toUpperCase();
            if (!query) {
                alert('Please enter a rule ID (e.g., GEN-6.2.3)');
                return;
            }

            const directIdMatch = document.getElementById(query);
            if (directIdMatch) {
                scrollToElementWithOffset(directIdMatch, 'smooth');
                highlightRuleTarget(directIdMatch);
                return;
            }

            const strongMatches = Array.from(document.querySelectorAll('#ruleContent strong'));
            const strongRuleId = strongMatches.find((strongEl) => strongEl.textContent.trim().toUpperCase() === query);

            if (strongRuleId) {
                const preferredTarget = strongRuleId.closest('.rule-id') || strongRuleId;
                scrollToElementWithOffset(preferredTarget, 'smooth');
                highlightRuleTarget(preferredTarget);
            } else {
                alert(`Rule ${query} not found in the rulebook`);
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Show/hide back-to-top button
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTop');
            if (window.scrollY > 300) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        });

        // Search on Enter
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') jumpToRule();
        });

        window.addEventListener('load', () => {
            updateAnchorScrollOffsetVar();
            setTimeout(() => alignToHashTarget('auto'), 0);
        });

        window.addEventListener('resize', updateAnchorScrollOffsetVar);
        window.addEventListener('hashchange', () => alignToHashTarget('smooth'));

        // ---------------------------------------------------------------
        // Per-rule "copy link" buttons
        // ---------------------------------------------------------------
        (function attachCopyLinkButtons() {
            const ruleParagraphs = document.querySelectorAll('p.rule-id[id]');
            ruleParagraphs.forEach(p => {
                if (p.querySelector('.rule-copy-link')) return;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'rule-copy-link';
                btn.title = 'Copy link to this rule';
                btn.setAttribute('aria-label', 'Copy link to ' + p.id);
                btn.textContent = '🔗';
                btn.addEventListener('click', async (ev) => {
                    ev.preventDefault();
                    ev.stopPropagation();
                    // Preserve current query string (e.g. ?lang=eng) so the copied
                    // link opens in the same language the reader is currently viewing.
                    const url = window.location.origin + window.location.pathname + window.location.search + '#' + p.id;
                    try {
                        if (navigator.clipboard && window.isSecureContext) {
                            await navigator.clipboard.writeText(url);
                        } else {
                            // Fallback for non-HTTPS / older browsers
                            const ta = document.createElement('textarea');
                            ta.value = url;
                            ta.setAttribute('readonly', '');
                            ta.style.position = 'absolute';
                            ta.style.left = '-9999px';
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            document.body.removeChild(ta);
                        }
                        btn.classList.add('copied');
                        const originalText = btn.textContent;
                        btn.textContent = '✓';
                        setTimeout(() => {
                            btn.classList.remove('copied');
                            btn.textContent = originalText;
                        }, 1200);
                    } catch (err) {
                        console.warn('Copy failed:', err);
                    }
                });
                p.appendChild(btn);
            });
        })();
    </script>
</body>
</html>
